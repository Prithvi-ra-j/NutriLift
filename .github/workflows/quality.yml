name: Quality Gate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - design/pinterest-polish
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, tests and Expo diagnostics
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        run: npx tsc --noEmit --pretty false 2>&1 | tee typecheck.log
        continue-on-error: true

      - name: Upload typecheck log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: typecheck-log
          path: typecheck.log
          if-no-files-found: error

      - name: Unit tests
        run: npm test -- --runInBand --passWithNoTests

      - name: Expo diagnostics
        run: npx expo-doctor
