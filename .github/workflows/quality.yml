name: Quality

on:
  push:
    branches:
      - "redesign/**"
  pull_request:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Expo diagnostics
        run: npx expo-doctor
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Tests
        run: npm test -- --runInBand
      - name: Web export
        run: npm run build:web
