name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck

  lint:
    name: ESLint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint

  tests:
    name: Unit and migration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Unit tests
        run: npm test -- --ci
      - name: SQLite migration tests
        run: npm run test:migrations

  expo-config:
    name: Expo config and assets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Resolve public Expo config
        run: npx expo config --type public --json > "$RUNNER_TEMP/expo-config.json"
      - name: Verify configured assets exist
        env:
          EXPO_CONFIG_PATH: ${{ runner.temp }}/expo-config.json
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const parsed = JSON.parse(fs.readFileSync(process.env.EXPO_CONFIG_PATH, 'utf8'));
          const config = parsed.expo || parsed;
          const assets = [
            ['icon', config.icon],
            ['splash image', config.splash?.image],
            ['Android adaptive icon', config.android?.adaptiveIcon?.foregroundImage],
            ['web favicon', config.web?.favicon],
          ].filter(([, value]) => typeof value === 'string' && value.startsWith('.'));
          const missing = assets
            .map(([label, value]) => [label, path.resolve(value)])
            .filter(([, file]) => !fs.existsSync(file));
          if (missing.length) {
            console.error('Configured Expo assets are missing:');
            for (const [label, file] of missing) console.error(`- ${label}: ${file}`);
            process.exit(1);
          }
          console.log(`Verified ${assets.length} configured local Expo assets.`);
          NODE

  deno-check:
    name: Supabase Edge Function typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Typecheck Edge Functions
        run: deno check supabase/functions/ai-chat/index.ts supabase/functions/ai-transcribe/index.ts

  android-build:
    name: Clean Android debug build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install dependencies
        run: npm ci
      - name: Install Android SDK components
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"
      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean --no-install
      - name: Assemble debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon
