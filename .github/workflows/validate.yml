name: NutriLift validation

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - implementation/phase-0-baseline
  workflow_dispatch:

concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, tests, and Expo config
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps

      - name: Runtime dependency audit triage
        shell: bash
        run: |
          set +e
          npm audit --omit=dev --json > "$RUNNER_TEMP/runtime-dependency-audit.json"
          audit_exit=$?
          node - "$RUNNER_TEMP/runtime-dependency-audit.json" <<'NODE'
          const fs = require("node:fs");
          const reportPath = process.argv[2];
          let report;
          try { report = JSON.parse(fs.readFileSync(reportPath, "utf8")); }
          catch (error) {
            console.error("Could not parse npm audit output:", error.message);
            process.exit(1);
          }
          const counts = report.metadata?.vulnerabilities ?? {};
          const totals = ["critical", "high", "moderate", "low", "info"].map((severity) =>
            `${severity}=${counts[severity] ?? 0}`).join(", ");
          console.log(`Production dependency advisory summary: ${totals}`);
          for (const [name, item] of Object.entries(report.vulnerabilities ?? {})) {
            console.log(`- ${name}: severity=${item.severity}; direct=${item.isDirect}; range=${item.range}; fixAvailable=${JSON.stringify(item.fixAvailable)}`);
          }
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            `### Runtime dependency audit\n\n${totals}\n\nReview package reachability and remediation before release.\n`);
          NODE
          echo "npm audit exit code: $audit_exit (report retained in job logs; audit is a triage signal, not silently treated as a build failure)"

      - name: TypeScript check
        run: npm run typecheck

      - name: SQLite migration contract and upgrade tests
        run: npm run test:migrations

      - name: Jest tests
        run: npm test -- --passWithNoTests

      - name: Set up Deno for Supabase Edge Functions
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check Supabase Edge Functions
        run: deno check supabase/functions/ai-chat/index.ts supabase/functions/ai-transcribe/index.ts

      - name: Validate Expo configuration and referenced assets
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const config = require('./app.json').expo;
          const paths = [
            config.icon,
            config.splash?.image,
            config.android?.adaptiveIcon?.foregroundImage,
            config.web?.favicon,
          ].filter(Boolean);
          const missing = paths.filter((asset) => !fs.existsSync(path.resolve(asset)));
          if (missing.length) {
            console.error('Missing local Expo assets:');
            for (const asset of missing) console.error(` - ${asset}`);
            process.exitCode = 1;
          } else {
            console.log(`Validated ${paths.length} referenced local assets.`);
          }
          NODE
          npx expo config --type public >/dev/null

      - name: Set up Java for Android build
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Build installable Android debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: Preserve Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nutrilift-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Install and launch on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb install android/app/build/outputs/apk/debug/app-debug.apk
            adb shell monkey -p com.prithvi.nutrilift 1
            sleep 15
            adb shell pidof com.prithvi.nutrilift

