name: Build Android APK (EAS)

on:
  push:
    branches:
      - main
      - "redesign/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  quality:
    name: Typecheck and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Expo diagnostics
        run: npx expo-doctor
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Tests
        run: npm test -- --runInBand

  build:
    name: Build Android APK
    needs: quality
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify Expo CLI
        run: npx expo --version
      - name: Build Android preview
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli@24.3.0 build --platform android --profile preview --non-interactive --verbose-logs
