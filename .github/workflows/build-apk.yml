name: Build Android APK (EAS)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  quality:
    name: Typecheck and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Expo diagnostics
        run: npx expo-doctor
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Tests
        run: npm test -- --runInBand

  build:
    name: Build Android APK
    needs: quality
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
          cache: npm
      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: 54.0.34
          eas-version: 24.3.0
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Install dependencies
        run: npm ci
      - name: Build Android preview
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --platform android --profile preview --non-interactive --verbose-logs
