name: Build Android APK (EAS)

on:
  push:
    branches:
      - main
      - design/pinterest-polish
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: 54
          eas-version: latest
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Android preview
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set +e
          eas build --platform android --profile preview --non-interactive 2>&1 | tee eas-build.log
          status=${PIPESTATUS[0]}
          echo $status > eas-build.exit
          exit $status
        continue-on-error: true

      - name: Upload EAS build log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eas-build-log
          path: |
            eas-build.log
            eas-build.exit
          if-no-files-found: error